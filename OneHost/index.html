        <h1>Grafiki pracy, przeglądy sprzętu i certyfikaty pracowników — w jednej platformie</h1>
        <p><strong>OneHost</strong> to polska platforma SaaS łącząca trzy narzędzia: <em>ShiftPlanner</em> (planowanie grafiku pracy), <em>Equipment Manager</em> (przeglądy sprzętu i maszyn) oraz <em>CertTrack</em> (ewidencja certyfikatów i uprawnień pracowników). Zaoszczędź 20% kupując pakiet. Plan Starter — 7 dni za darmo bez karty.</p>
        <p><a href="/register"><strong>Rozpocznij darmowy trial →</strong></a></p>

        <h2>ShiftPlanner — planowanie grafiku pracy online</h2>
        <p>Dowolny system zmianowy: 2-zmianowy, 3-zmianowy, 4-brygadowy (praca ciągła), 12-godzinny, weekendowy lub własny. Zarządzanie urlopami, stanowiskami, eksport PDF. Od 89 PLN/mies.</p>

        <h2>Equipment Manager — zarządzanie przeglądami sprzętu</h2>
        <p>Ewidencja sprzętu z terminami przeglądów i kalibracji. Powiadomienia push w przeglądarce. Import/eksport CSV. Od 59 PLN/mies.</p>

        <h2>CertTrack — ewidencja certyfikatów i uprawnień pracowników</h2>
        <p>Baza certyfikatów, uprawnień SEP i szkoleń pracowników. Automatyczne powiadomienia o wygasaniu. Raporty PDF. Od 79 PLN/mies.</p>
