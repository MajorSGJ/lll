# OneHost stack reverse-proxy (SSL on 443)
# Place in: /etc/nginx/sites-available/onehost-domains.conf
# Enable via symlink to sites-enabled and reload nginx.

server {
    listen 68;
    listen [::]:68;
    server_name sklep.onehost.site shiftplanner.onehost.site em.onehost.site certtrack.onehost.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sklep.onehost.site;

    ssl_certificate /etc/letsencrypt/live/sklep.onehost.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sklep.onehost.site/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:55;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:56/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

